[project]
name = "shit-factory-ai-video-generator"
version = "0.1.0"
description = "AI-powered video and image generation CLI tools"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "typer>=0.12.0",
  "requests>=2.31.0",
  "python-dotenv>=1.0.1",
  "google-cloud-aiplatform>=1.90.0",
  "google-genai>=1.45.0",
  "google-generativeai>=0.8.5",
  "pillow>=11.3.0",
]

[project.scripts]
video-cli = "app.cli:app"
image-cli = "app.image_cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "external: tests that require external services or tokens",
  "integration: slower tests using subprocess/cli or containers",
  "unit: fast tests without subprocess",
]
addopts = "-q --cov=app --cov=tests --cov-report=term-missing --cov-fail-under=42"

[tool.coverage.run]
omit = [
  "app/cli.py",
  "app/providers/veo.py",
  "app/image_gen/gemini.py",
]
